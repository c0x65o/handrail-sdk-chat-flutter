name: Flutter analyze

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: flutter-analyze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.7"
          cache: true
          pub-cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get --no-example
        working-directory: .
      - name: Analyze Flutter SDK
        run: flutter analyze --no-pub lib test
        working-directory: .
