<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../dist/ui/styles.css" />
    <title>Handrail Chat style fixture</title>
  </head>
  <body>
    <main>
      <section
        class="handrail-chat"
        aria-label="Chat style fixture"
        style="--hr-chat-color-accent: rgb(109 40 217); --hr-chat-focus-color: rgb(190 24 93)"
      >
        <div class="handrail-chat__surface handrail-chat__stack">
          <span class="handrail-chat__muted">Host-themed chat controls</span>
          <button class="handrail-chat__button" data-handrail-focus type="button">
            Focus me
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
